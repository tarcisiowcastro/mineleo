# Copie para minetest.conf e ajuste conforme necessário.

port = 30000
map-dir = /luanti/world
server_name = MineLeo
server_description = Servidor privado da familia
max_users = 6

# Impede jogadores novos de se cadastrarem sozinhos; so quem ja tem
# senha cadastrada (via 'luantiserver --terminal' ou lista abaixo) entra.
disallow_empty_password = true

# Adicione aqui os nomes que podem entrar como administradores.
# name = senha (defina a senha real na primeira vez que o jogador logar)
#name = "leo"

creative_mode = true
enable_damage = false
default_privs = interact, shout, fast, fly
